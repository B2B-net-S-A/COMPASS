name: Timesheet reminder (monthly cron)

# Phase 52 — jedno przypomnienie na osobę na miesiąc, za miesiąc ZAMKNIĘTY.
#
# Wcześniej: 25-go, czyli za miesiąc jeszcze trwający. Teraz odpalamy codziennie
# 1.–5., bo tyle trwa okno przed terminem (5. dzień miesiąca). Codziennie, a nie
# jednego dnia, żeby przeoczony przebieg (opóźnienia schedulera GH, chwilowy 5xx)
# nie oznaczał braku przypomnienia przez cały miesiąc.
#
# Wielokrotne wołanie jest bezpieczne: o „raz na miesiąc" decyduje trasa
# (rezerwacja w timesheet_reminder_log z UNIQUE na user+okres), nie harmonogram.
# Z tego samego powodu równoległe zadanie w Coolify nie tworzy duplikatów.

on:
  schedule:
    # 1.–5. dnia miesiąca o 08:00 UTC (≈ 09:00 / 10:00 w Warszawie zależnie od DST)
    - cron: '0 8 1-5 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timesheet-reminder
  cancel-in-progress: false

jobs:
  trigger-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Curl /api/cron/timesheet-reminder
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing APP_URL variable or CRON_SECRET. Configure them in repo settings." >&2
            exit 1
          fi
          echo "Calling $APP_URL/api/cron/timesheet-reminder"
          # Bearer, nie ?secret= — sekret w query trafia do logów CF/proxy/Sentry,
          # a trasa loguje za to ostrzeżenie o przestarzałym wywołaniu.
          curl -fsSL --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/timesheet-reminder" | tee /tmp/result.json
          echo
          echo "✅ Reminder cron completed."
