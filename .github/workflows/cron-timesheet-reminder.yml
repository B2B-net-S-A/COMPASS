name: Timesheet reminder (monthly cron)

# Phase 52 — jedno przypomnienie na osobę na miesiąc, za miesiąc ZAMKNIĘTY.
#
# Wcześniej: 25-go, czyli za miesiąc jeszcze trwający. Teraz odpalamy codziennie
# 1.–5., bo tyle trwa okno przed terminem (5. dzień miesiąca). Codziennie, a nie
# jednego dnia, żeby przeoczony przebieg (opóźnienia schedulera GH, chwilowy 5xx)
# nie oznaczał braku przypomnienia przez cały miesiąc.
#
# Wielokrotne wołanie jest bezpieczne: o „raz na miesiąc" decyduje trasa
# (rezerwacja w timesheet_reminder_log z UNIQUE na user+okres), nie harmonogram.
# Z tego samego powodu równoległe zadanie w Coolify nie tworzy duplikatów.
#
# HISTORIA: do 2026-08-12 ten workflow NIE wysłał ani jednego maila — w repo nie było
# sekretu `CRON_SECRET`, więc każde odpalenie (25.05, 25.06, 25.07) kończyło się błędem
# na starcie i jedynym realnym nadawcą był Coolify. Sekret uzupełniony, oba schedulery
# działają — duplikatów nie ma, bo o „raz na miesiąc" decyduje rezerwacja w bazie.
#
# Brak sekretu daje ostrzeżenie i zielony przebieg zamiast czerwonego: przy harmonogramie
# 1.–5. byłoby to pięć fałszywych alarmów miesięcznie zamiast jednego.
# Rotacja wartości: action=cron-secret-ciphertext w workflow „Coolify Ops".

on:
  schedule:
    # 1.–5. dnia miesiąca o 08:00 UTC (≈ 09:00 / 10:00 w Warszawie zależnie od DST)
    - cron: '0 8 1-5 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timesheet-reminder
  cancel-in-progress: false

jobs:
  trigger-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Curl /api/cron/timesheet-reminder
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Brak zmiennej APP_URL — ustaw ją w ustawieniach repo."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            # Nie błąd, tylko nieskonfigurowana redundancja: przypomnienia wysyła
            # zadanie `timesheet-reminder` w Coolify. Ten workflow rusza dopiero, gdy
            # ktoś doda sekret — do tego czasu nie ma sensu farbować CI na czerwono.
            echo "::warning::Pominięte — brak sekretu CRON_SECRET. Przypomnienia leżą na Coolify; dodaj sekret, żeby mieć drugi scheduler."
            exit 0
          fi
          echo "Calling $APP_URL/api/cron/timesheet-reminder"
          # Bearer, nie ?secret= — sekret w query trafia do logów CF/proxy/Sentry,
          # a trasa loguje za to ostrzeżenie o przestarzałym wywołaniu.
          curl -fsSL --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/timesheet-reminder" | tee /tmp/result.json
          echo
          echo "✅ Reminder cron completed."
