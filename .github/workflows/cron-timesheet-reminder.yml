name: Timesheet reminder (monthly cron)

on:
  schedule:
    # 25th of each month at 09:00 UTC (≈ 10:00 / 11:00 Warsaw depending on DST)
    - cron: '0 9 25 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timesheet-reminder
  cancel-in-progress: false

jobs:
  trigger-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Curl /api/cron/timesheet-reminder
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing APP_URL variable or CRON_SECRET. Configure them in repo settings." >&2
            exit 1
          fi
          echo "Calling $APP_URL/api/cron/timesheet-reminder"
          curl -fsSL --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/timesheet-reminder" | tee /tmp/result.json
          echo
          echo "✅ Reminder cron completed."
