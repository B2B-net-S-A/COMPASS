name: Deploy

# Unified deployment workflow per ~/.claude/rules/deployment.md.
# Identyczny pattern dla wszystkich 3 apek (Compass, NEXUS, LeadGen).
#
# Push do main → trigger Coolify deploy via API → poll deployment status by
# UUID → smoke test /api/health. Coolify samo buduje + restart kontenerów.
#
# 2026-07-16 (port of the NEXUS deploy fix, Nexus PR #764): the old flow fired
# the webhook and then blind-slept before polling /api/health. Two real
# failure modes observed on NEXUS slipped through or wedged it:
#   1. Coolify HTTP 429 "Deployment queue is full" — fast curl retries could
#      never outlast a queue backed up by a slow ARM build, so every main
#      push after the first went red.
#   2. A deployment that FAILED server-side was invisible: the webhook said
#      "queued", the smoke test then burned minutes polling a stale version
#      and reported a generic timeout with zero diagnostics.
# Now we save the deployment UUID, poll its status, fail fast on
# failed/cancelled with the server-side log tail, and only then health-check.
#
# 2026-08-08 (port koalescencji burstów z Nexus PR #1072): przy serii merge'y
# każdy push na main odpalał osobny pełny rebuild Coolify, mimo że Coolify
# klonuje HEAD maina w momencie budowy — pierwszy build z burstu wdraża więc
# także późniejsze commity, a kolejne buildy tylko mielą kolejkę (429 "queue
# is full"). Teraz deploy job najpierw pyta /api/health: jeśli produkcja
# serwuje już nasz commit lub jego POTOMKA, pomija rebuild i przechodzi
# wprost do smoke testu. Smoke test akceptuje potomka (pokrewieństwo przez
# compare API) — wcześniej wyprzedzony deploy czerwieniał mimo udanego
# wdrożenia. Do wprowadzania wielu PR-ów naraz: scripts/merge-train.sh.
#
# Required GH secrets:
#   COOLIFY_URL       e.g. https://coolify-compass.dynaminds.pl
#   COOLIFY_TOKEN     Bearer token (Sanctum personal_access_tokens)
#   COOLIFY_APP_UUID  Application UUID (from Coolify panel resource URL)
#
# Required GH variables:
#   APP_URL           Production URL for smoke test (e.g. https://compass.dynaminds.pl)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # UA contract from ~/.claude/rules/observability.md — the dynaminds.pl zone
  # has a CF firewall bypass-rule matching UA contains "dynaminds-smoke-test"
  # AND path eq "/api/health" (GH runner IPs are datacenter → threat_score
  # block otherwise). Keep both sides of that contract in sync.
  SMOKE_UA: "dynaminds-smoke-test/1.0 (+github-actions; compass)"
  # Release prerequisite: install the host controller and seed its signatures
  # before merging this Academy release. Keep deployment policy in reviewed code.
  ACADEMY_CLAMAV_COLOCATED: "true"

jobs:
  deploy:
    name: Trigger Coolify deploy
    if: github.repository == 'B2B-net-S-A/COMPASS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: env.ACADEMY_CLAMAV_COLOCATED == 'true'
        with:
          persist-credentials: false
          sparse-checkout: ops/academy/clamav
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.ACADEMY_CLAMAV_COLOCATED == 'true'
        with:
          node-version: '20'
      - name: Skip if target already live (burst coalescing)
        id: precheck
        # Ręczny workflow_dispatch NIGDY nie skipuje — to ścieżka świadomego
        # redeployu (np. po zmianie env varów), gdzie rebuild jest celem.
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # Coolify klonuje HEAD maina w momencie budowy, nie pushnięty SHA —
          # przy burstach merge'y wcześniejszy deployment zwykle wdrożył już
          # nasz commit razem z nowszymi. Kolejny pełny rebuild niczego wtedy
          # nie zmienia na produkcji, a rebuild-churn zapycha kolejkę Coolify
          # (HTTP 429). Jeżeli /api/health serwuje już nasz SHA albo jego
          # POTOMKA — skip=true i job przechodzi od razu do smoke testu.
          # Każdy błąd sondy = fail-open do normalnego deployu.
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ -z "$APP_URL" ]; then
            echo "APP_URL unset — deploying normally"
            exit 0
          fi
          response=$(curl -fsSL --max-time 15 -A "$SMOKE_UA" "$APP_URL/api/health" 2>/dev/null || echo '')
          version=$(echo "$response" | jq -r '.version // ""' 2>/dev/null || echo '')
          if [ -z "$version" ] || [ ${#version} -lt 7 ]; then
            echo "No usable live version — deploying normally"
            exit 0
          fi
          if [ "$version" = "${{ github.sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ Produkcja już serwuje ${{ github.sha }} — pomijam redundantny rebuild."
            exit 0
          fi
          rel=$(curl -fsSL \
                -H "Authorization: Bearer ${{ github.token }}" \
                -H "Accept: application/vnd.github+json" \
                "${{ github.api_url }}/repos/${{ github.repository }}/compare/${{ github.sha }}...${version}" \
                2>/dev/null | jq -r '.status // "unknown"' || echo unknown)
          if [ "$rel" = "ahead" ] || [ "$rel" = "identical" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ Produkcja serwuje $version (pokrewieństwo=$rel wobec targetu) — nasz kod już wdrożony, pomijam rebuild."
          else
            echo "Live=$version, target=${{ github.sha }}, pokrewieństwo=$rel — deploying normally"
          fi

      - name: Update build metadata in Coolify env vault
        if: ${{ steps.precheck.outputs.skip != 'true' }}
        # Push GIT_SHA + BUILT_AT into Coolify env vault BEFORE triggering deploy
        # so the next docker build receives them as ARG/ENV. /api/health then
        # returns the real version + deploy timestamp instead of "unknown".
        # Patch is idempotent — Coolify upserts envs by key.
        run: |
          GIT_SHA="${{ github.sha }}"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for entry in \
            "GIT_SHA=$GIT_SHA" \
            "BUILT_AT=$BUILT_AT"
          do
            key="${entry%%=*}"
            value="${entry#*=}"
            payload=$(jq -nc \
              --arg k "$key" --arg v "$value" \
              '{key: $k, value: $v, is_buildtime: true, is_runtime: true, is_preview: false}')
            http=$(curl -sS --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/resp.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "$payload" \
              "${{ secrets.COOLIFY_URL }}/api/v1/applications/${{ secrets.COOLIFY_APP_UUID }}/envs")
            if [ "$http" -ge 400 ]; then
              echo "::warning::PATCH $key returned HTTP $http: $(cat /tmp/resp.json)"
              # Try POST as fallback (in case env doesn't exist yet)
              http=$(curl -sS --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/resp.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -d "$payload" \
                "${{ secrets.COOLIFY_URL }}/api/v1/applications/${{ secrets.COOLIFY_APP_UUID }}/envs")
              if [ "$http" -ge 400 ]; then
                echo "::error::Failed to set $key (POST also returned HTTP $http): $(cat /tmp/resp.json)"
                exit 1
              fi
            fi
            echo "✅ $key set (HTTP $http)"
          done

      - name: Pause colocated Academy scanner before any build
        id: academy_pause
        if: env.ACADEMY_CLAMAV_COLOCATED == 'true' && steps.precheck.outputs.skip != 'true'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: node ops/academy/clamav/deploy-hook.mjs pause

      - name: Deploy (trigger + wait, with retry on server-side build failure)
        if: ${{ steps.precheck.outputs.skip != 'true' }}
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          av_hook() {
            if [ "$ACADEMY_CLAMAV_COLOCATED" = true ]; then
              node ops/academy/clamav/deploy-hook.mjs "$@"
            fi
          }
          # ─── Dlaczego całość jest w pętli retry ──────────────────────────────
          # Build po stronie Coolify bywa flaky: 4 z 30 przebiegów (13%) padły
          # z `exit code 255` na `docker compose build`, zwykle po ~75-85 s —
          # czyli na wczesnym etapie (pobieranie zależności), nie w kompilacji,
          # która trwa ~13 min. Za każdym razem ręczny re-dispatch przechodził.
          #
          # Ponowienie jest bezpieczne, bo TEN SAM kod zbudował się już na
          # runnerze: `Typecheck + Lint + Test + Build` to required check przed
          # merge. Build padający dopiero w Coolify to więc praktycznie zawsze
          # infrastruktura, nie kod — a jeśli byłby to jednak kod, druga próba
          # padnie tak samo i job i tak skończy się czerwony.
          MAX_ATTEMPTS=2
          RETRY_BACKOFF_S=30

          for deploy_attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "───── Deploy attempt $deploy_attempt/$MAX_ATTEMPTS ─────"

            # ── Trigger ──
            # 20 prób × 30 s ≈ 10 min:
            #  - HTTP 429 (kolejka pełna) musi przeczekać trwający build ARM
            #    (4-6 min na zimno), nie kilka szybkich ponowień.
            #  - HTTP 5xx (flaky webhook) goi się po jednym-dwóch odczekaniach.
            http_code=""
            response=""
            for attempt in $(seq 1 20); do
              av_hook begin-trigger "$deploy_attempt-$attempt"
              raw=$(curl -sS -X GET \
                -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
                -H "Accept: application/json" \
                -w $'\nHTTP_CODE:%{http_code}' \
                "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}&force=false" \
                2>&1 || true)
              http_code=$(echo "$raw" | grep -oE 'HTTP_CODE:[0-9]+' | tail -1 | cut -d: -f2)
              response=$(echo "$raw" | sed -E 's/HTTP_CODE:[0-9]+$//')
              if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
                echo "Coolify responded $http_code on attempt $attempt"
                break
              fi
              if [ "$ACADEMY_CLAMAV_COLOCATED" = true ]; then
                # Even queue-full can mean another build is consuming this host.
                # No retry or scanner restart until an operator resolves it.
                echo '::error::Unconfirmed trigger or busy queue; scanner stays paused. Inspect Coolify before recovery.'
                exit 1
              fi
              echo "::warning::Attempt $attempt/20 — Coolify HTTP $http_code, body: $response"
              if [ $attempt -lt 20 ]; then
                sleep 30
              fi
            done
            if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
              echo "::error::Coolify deploy webhook failed after 20 attempts (last HTTP $http_code). If it was 429 the queue is stuck — run the 'Coolify Ops' workflow (action=list, then cancel the wedged deployment UUIDs) and re-dispatch Deploy."
              exit 1
            fi
            DEPLOYMENT_UUID=$(echo "$response" | jq -r '.deployments[0].deployment_uuid')
            if [ -z "$DEPLOYMENT_UUID" ] || [ "$DEPLOYMENT_UUID" = "null" ]; then
              echo "::error::Failed to start deployment (no deployment_uuid in response)"
              exit 1
            fi
            av_hook bind "$deploy_attempt-$attempt" "$DEPLOYMENT_UUID"
            echo "Deployment queued: $DEPLOYMENT_UUID"

            # ── Wait ──
            # Odpytujemy konkretny deployment zamiast ślepego sleepa.
            # Statusy: queued | in_progress | finished | failed | cancelled-by-user.
            # 60 × 15 s = 15 min sufitu (zimny build ARM z ciężkimi natywnymi zależnościami).
            status=""
            outcome="timeout"
            for i in $(seq 1 60); do
              resp=$(curl -sS \
                -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
                -H "Accept: application/json" \
                "${{ secrets.COOLIFY_URL }}/api/v1/deployments/$DEPLOYMENT_UUID" 2>/dev/null || echo '')
              status=$(echo "$resp" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")
              case "$status" in
                finished)
                  av_hook terminal "$DEPLOYMENT_UUID" finished
                  echo "✅ Deployment $DEPLOYMENT_UUID finished after ~$((i * 15))s (attempt $deploy_attempt)"
                  exit 0
                  ;;
                failed|cancelled*|cancelled-by-user)
                  if [ "$status" = failed ]; then
                    av_hook terminal "$DEPLOYMENT_UUID" failed
                  else
                    av_hook terminal "$DEPLOYMENT_UUID" cancelled
                  fi
                  echo "::warning::Deployment $DEPLOYMENT_UUID ended with status=$status after ~$((i * 15))s — server-side log tail below"
                  # .logs to JSON z tablicą {output,type,hidden,...}. Drukujemy
                  # ostatnie widoczne wpisy; przy zmianie kształtu pomijamy treść.
                  # 60 wpisów × 1200 znaków:
                  # przy 30×400 prawdziwa przyczyna (npm/docker) nie mieściła się
                  # w oknie i w logach zostawała sama komenda `docker compose build`.
                  logs=$(echo "$resp" | jq -r '.logs // ""' 2>/dev/null || echo '')
                  if [ -n "$logs" ]; then
                    echo "$logs" | jq -r '.[-60:][] | select(.hidden != true) | "[\(.type // "out")] \((.output // "") | .[0:1200])"' 2>/dev/null \
                      || echo '(deployment logs omitted: unsupported response format)'
                  else
                    echo "(no logs returned by API)"
                  fi
                  outcome="$status"
                  break
                  ;;
                *)
                  echo "Attempt $i/60: status=$status, retrying in 15s..."
                  sleep 15
                  ;;
              esac
            done

            # Anulowanie przez człowieka respektujemy — ponowienie działałoby
            # wbrew intencji osoby, która nacisnęła „cancel".
            case "$outcome" in
              cancelled*|cancelled-by-user)
                echo "::error::Deployment $DEPLOYMENT_UUID was cancelled — not retrying."
                exit 1
                ;;
              timeout)
                # Build wisi (>15 min). Kolejna próba tylko zatkałaby kolejkę
                # obok wciąż działającego builda — wymaga ręcznej inspekcji.
                echo "::error::Deployment $DEPLOYMENT_UUID still '$status' after 15 min — treating as failed, not retrying. Run the 'Coolify Ops' workflow to inspect/cancel it."
                exit 1
                ;;
            esac

            if [ "$deploy_attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::Build failed server-side (attempt $deploy_attempt/$MAX_ATTEMPTS) — retrying in ${RETRY_BACKOFF_S}s. Ta klasa awarii (exit 255 po ~75 s) historycznie przechodzi za drugim razem."
              sleep "$RETRY_BACKOFF_S"
            fi
          done

          echo "::error::Deployment failed on all $MAX_ATTEMPTS attempts — this is unlikely to be flake. Sprawdź log powyżej (pełniejszy niż wcześniej: 60 wpisów × 1200 znaków)."
          exit 1

      - name: Resume Academy scanner only after confirmed terminal deployments
        if: always() && steps.academy_pause.outcome == 'success'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: node ops/academy/clamav/deploy-hook.mjs resume

  smoke-test:
    name: Smoke test /api/health
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Healthcheck (standard shape + version match)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::vars.APP_URL not set in repo settings"
            exit 1
          fi
          EXPECTED_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          # The deploy job already confirmed the deployment FINISHED server-side,
          # so this only needs to absorb the container swap + app boot —
          # 20 × 15s = 5 min is plenty (was: sleep 60 + 28×15s ≈ 8 min).
          #
          # Cloudflare path — testujemy real CF→origin route przez bypass-rule
          # (id fb25a18b5a2a4f10bcd813b2afaef2fa) — patrz env.SMOKE_UA wyżej
          # i ~/.claude/rules/observability.md §Cloudflare smoke-test bypass.
          for i in $(seq 1 20); do
            response=$(curl -fsSL -A "$SMOKE_UA" "$APP_URL/api/health" 2>/tmp/curl_err || echo '')
            if [ -n "$response" ]; then
              status=$(echo "$response" | jq -r '.status // "missing"')
              version=$(echo "$response" | jq -r '.version // "missing"')
              version_short=$(echo "$version" | cut -c1-7)
              if [ "$status" != "unhealthy" ] && [ "$status" != "missing" ]; then
                if [ "$version_short" = "$EXPECTED_SHA" ]; then
                  echo "✅ Pass: status=$status version=$version"
                  exit 0
                fi
                # Coolify klonuje main HEAD w momencie budowania, a ten job
                # porównuje z SHA, który deploy WYWOŁAŁ. Przy serii merge'y
                # deploy dla commitu N zastaje na produkcji N+1 i czerwieniał
                # mimo udanego wdrożenia (fix z Nexus #965/#1072). Jeśli wersja
                # na produkcji jest POTOMKIEM naszego SHA — nasz kod tam jest,
                # to sukces. Inny wynik leci dalej w pętlę ponowień.
                if [ "$version" != "missing" ] && [ ${#version} -ge 7 ]; then
                  rel=$(curl -fsSL \
                        -H "Authorization: Bearer ${{ github.token }}" \
                        -H "Accept: application/vnd.github+json" \
                        "${{ github.api_url }}/repos/${{ github.repository }}/compare/${{ github.sha }}...${version}" \
                        2>/dev/null | jq -r '.status // "unknown"' || echo unknown)
                  if [ "$rel" = "ahead" ]; then
                    echo "✅ Pass: na produkcji $version_short — potomek $EXPECTED_SHA (deploy wyprzedzony przez nowszy merge)."
                    exit 0
                  fi
                  echo "Attempt $i/20: stale version (got $version_short, expected $EXPECTED_SHA, pokrewieństwo=$rel), retrying in 15s..."
                else
                  echo "Attempt $i/20: stale version (got $version_short, expected $EXPECTED_SHA), retrying in 15s..."
                fi
              else
                echo "Attempt $i/20: status=$status, retrying in 15s..."
              fi
            else
              # Surface curl's actual error so future silent failures are
              # diagnosable in 1 attempt instead of 20 (e.g. Cloudflare WAF
              # 403 on the runner IP, like Atlas hit — see Atlas PR #96).
              echo "Attempt $i/20: no response — $(cat /tmp/curl_err 2>/dev/null | head -1), retrying in 15s..."
            fi
            sleep 15
          done
          echo "::error::Smoke test failed after 20 attempts (5 min) — deployment finished server-side but the app never served the new SHA"
          exit 1
