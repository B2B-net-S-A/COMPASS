name: Deploy
run-name: Deploy COMPASS ${{ github.event.workflow_run.head_sha || inputs.target_sha }}

# Deployment is allowed only after the required Build check workflow completed
# successfully for main, or for a manually selected SHA which already has a
# successful `quality-gate` check run.
#
# Required GitHub Environment: production (configure required reviewers).
# Required secrets in that environment:
#   COOLIFY_TOKEN       team-scoped token with write + deploy only
#   COOLIFY_READ_TOKEN  separate team-scoped read-only token
#   COOLIFY_APP_UUID    application UUID
# Required variables:
#   STAGING_COOLIFY_URL    e.g. https://coolify-staging.dynaminds.pl
#   PRODUCTION_COOLIFY_URL e.g. https://coolify-compass.dynaminds.pl
#   APP_URL             e.g. https://compass.dynaminds.pl
#   ROLLBACK_FLOOR_SHA  oldest explicitly approved rollback SHA
# Activation variable (must be set deliberately after the runbook is complete):
#   COMPASS_RELEASE_GATE_ENABLED=true

on:
  workflow_run:
    workflows: ["Build check"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character SHA that already passed quality-gate
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  release:
    name: Deploy exact SHA
    if: >-
      ${{ vars.COMPASS_RELEASE_GATE_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    # Includes the worst-case target deployment plus a complete rollback and
    # rollback-readiness verification. A shorter timeout can kill the safety path.
    timeout-minutes: 75
    environment: production
    steps:
      - name: Resolve immutable release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.target_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            TARGET_SHA="$WORKFLOW_SHA"
          else
            TARGET_SHA="$MANUAL_SHA"
          fi
          if ! echo "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Target must be a full lowercase 40-character Git SHA"
            exit 1
          fi
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.release.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit belongs to protected main
        env:
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "::error::Full-history checkout did not contain origin/main"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "::error::Target SHA is not reachable from protected main"
            exit 1
          fi

      - name: Verify quality-gate for a manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          response=$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/build-check.yml/runs?branch=main&status=completed&head_sha=$TARGET_SHA&per_page=100")
          passed=$(echo "$response" | jq --arg sha "$TARGET_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::The selected SHA has no successful main-branch Build check workflow"
            exit 1
          fi

      - name: Resolve migration head
        id: migration
        run: |
          head=$(find COMPASS/supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | sort | tail -n 1)
          if [ -z "$head" ]; then
            echo "::error::No Supabase migrations found"
            exit 1
          fi
          echo "head=$(basename "$head" .sql)" >> "$GITHUB_OUTPUT"

      - name: Deploy and verify exact SHA through Coolify
        env:
          COOLIFY_URL: ${{ vars.PRODUCTION_COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_READ_TOKEN: ${{ secrets.COOLIFY_READ_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          APP_URL: ${{ vars.APP_URL }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          BUILT_AT: ${{ steps.release.outputs.built_at }}
          MIGRATION_HEAD: ${{ steps.migration.outputs.head }}
          ROLLBACK_FLOOR_SHA: ${{ vars.ROLLBACK_FLOOR_SHA }}
          RELEASE_MANIFEST_PATH: ${{ github.workspace }}/release-manifest.json
        run: node COMPASS/scripts/coolify-release.mjs

      - name: Archive release manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest-${{ steps.release.outputs.target_sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
