name: Deploy

# Unified deployment workflow per ~/.claude/rules/deployment.md.
# Identyczny pattern dla wszystkich 3 apek (Compass, NEXUS, LeadGen).
#
# Push do main → trigger Coolify deploy via API → wait → smoke test /api/health.
# Coolify samo buduje + restart kontenerów (z compose `build:` block lub GHCR pull).
#
# Required GH secrets:
#   COOLIFY_URL       e.g. https://coolify-compass.dynaminds.pl
#   COOLIFY_TOKEN     Bearer token (Sanctum personal_access_tokens)
#   COOLIFY_APP_UUID  Application UUID (from Coolify panel resource URL)
#
# Required GH variables:
#   APP_URL           Production URL for smoke test (e.g. https://compass.dynaminds.pl)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_uuid:
        description: "Existing Coolify deployment UUID to inspect without deploying"
        required: false
        type: string
      schedule_action:
        description: "Inspect or idempotently upsert Consultant Success schedules"
        required: false
        type: choice
        options:
          - ""
          - inspect
          - upsert

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Coolify deploy
    if: inputs.schedule_action == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update build metadata in Coolify env vault
        if: inputs.deployment_uuid == ''
        # Push GIT_SHA + BUILT_AT into Coolify env vault BEFORE triggering deploy
        # so the next docker build receives them as ARG/ENV. /api/health then
        # returns the real version + deploy timestamp instead of "unknown".
        # Patch is idempotent — Coolify upserts envs by key.
        run: |
          GIT_SHA="${{ github.sha }}"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for entry in \
            "GIT_SHA=$GIT_SHA" \
            "BUILT_AT=$BUILT_AT"
          do
            key="${entry%%=*}"
            value="${entry#*=}"
            payload=$(jq -nc \
              --arg k "$key" --arg v "$value" \
              '{key: $k, value: $v, is_buildtime: true, is_runtime: true, is_preview: false}')
            http=$(curl -sS --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/resp.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "$payload" \
              "${{ secrets.COOLIFY_URL }}/api/v1/applications/${{ secrets.COOLIFY_APP_UUID }}/envs")
            if [ "$http" -ge 400 ]; then
              echo "::warning::PATCH $key returned HTTP $http: $(cat /tmp/resp.json)"
              # Try POST as fallback (in case env doesn't exist yet)
              http=$(curl -sS --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/resp.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -d "$payload" \
                "${{ secrets.COOLIFY_URL }}/api/v1/applications/${{ secrets.COOLIFY_APP_UUID }}/envs")
              if [ "$http" -ge 400 ]; then
                echo "::error::Failed to set $key (POST also returned HTTP $http): $(cat /tmp/resp.json)"
                exit 1
              fi
            fi
            echo "✅ $key set (HTTP $http)"
          done

      - name: Trigger deployment
        if: inputs.deployment_uuid == ''
        run: |
          response=$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -X GET \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}")
          echo "Response: $response"
          deployment_uuid=$(echo "$response" | jq -r '.deployments[0].deployment_uuid')
          if [ -z "$deployment_uuid" ] || [ "$deployment_uuid" = "null" ]; then
            echo "::error::Failed to start deployment"
            exit 1
          fi
          echo "Deployment queued: $deployment_uuid"
          echo "deployment_uuid=$deployment_uuid" >> $GITHUB_OUTPUT
        id: trigger

      - name: Observe Coolify deployment
        env:
          DEPLOYMENT_UUID: ${{ inputs.deployment_uuid || steps.trigger.outputs.deployment_uuid }}
        run: |
          for i in $(seq 1 36); do
            response=$(curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              -H "Accept: application/json" \
              "${{ secrets.COOLIFY_URL }}/api/v1/deployments/$DEPLOYMENT_UUID")
            status=$(echo "$response" | jq -r '.status // "unknown"')
            echo "Coolify deployment $DEPLOYMENT_UUID: status=$status (attempt $i/36)"

            case "$status" in
              finished)
                exit 0
                ;;
              failed|cancelled)
                echo "::error::Coolify deployment ended with status=$status"
                echo "$response" | jq '{status, commit, created_at, updated_at, logs_type: (.logs | type), logs_length: (.logs | length)}'
                if [ "$(echo "$response" | jq -r '.logs | length')" -gt 0 ]; then
                  echo "$response" | jq '{relevant_logs: (.logs | fromjson | map(select((.output // "") | test("fatal|heap|memory|sigabrt|abort|killed|enomem|pthread|resource temporarily|failed|error"; "i"))) | map({timestamp, type, output}) | .[-80:])}'
                else
                  echo "No deployment logs returned. Inspecting application status."
                  curl -fsSL \
                    -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
                    -H "Accept: application/json" \
                    "${{ secrets.COOLIFY_URL }}/api/v1/applications/${{ secrets.COOLIFY_APP_UUID }}" \
                    | jq '{uuid, name, status, git_branch, git_commit_sha, updated_at}'
                fi
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "::error::Coolify deployment did not finish within 6 minutes"
          response=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Accept: application/json" \
            "${{ secrets.COOLIFY_URL }}/api/v1/deployments/$DEPLOYMENT_UUID")
          echo "$response" | jq -r '.logs // "No deployment logs returned."' | tail -n 250
          exit 1

  smoke-test:
    name: Smoke test /api/health
    needs: deploy
    if: inputs.deployment_uuid == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Coolify build + restart
        run: sleep 60

      - name: Healthcheck (standard shape + version match)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::vars.APP_URL not set in repo settings"
            exit 1
          fi
          EXPECTED_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          # Coolify build typowo 3-5 min (BuildKit cache mounts + ARG reorder
          # + force_rebuild=f), max ~7-8 min na pierwszy build po dużej zmianie
          # next.config / Dockerfile. Plus restart ~30s. 28 retries × 15s = 7 min,
          # plus initial 60s wait = ~8 min total window — pokrywa worst-case
          # cold-cache, ale -1.5 min vs poprzednie 32×15s + sleep 90 (9.5 min).
          #
          # Cloudflare path — testujemy real CF→origin route (jak Atlas).
          # Wcześniejsze PR #91/#92 dostawały 32×403 od Bot Fight Mode (ASN +
          # TLS fingerprint), PR #93 obszedł CF przez --resolve do origin IP.
          # Teraz na zonie dynaminds.pl: BFM=OFF + custom firewall bypass-rule
          # (id fb25a18b5a2a4f10bcd813b2afaef2fa, action=bypass) matchuje
          # UA contains "dynaminds-smoke-test" AND path eq "/api/health"
          # — patrz ~/.claude/rules/observability.md §Cloudflare smoke-test
          # bypass. Drop --resolve + hardcoded origin IP, używamy standardu.
          UA="dynaminds-smoke-test/1.0 (+github-actions; compass)"
          for i in $(seq 1 28); do
            response=$(curl -fsSL \
              -A "$UA" \
              "$APP_URL/api/health" 2>/tmp/curl_err || echo '')
            if [ -n "$response" ]; then
              status=$(echo "$response" | jq -r '.status // "missing"')
              version=$(echo "$response" | jq -r '.version // "missing"')
              version_short=$(echo "$version" | cut -c1-7)
              if [ "$status" != "unhealthy" ] && [ "$status" != "missing" ]; then
                if [ "$version_short" = "$EXPECTED_SHA" ]; then
                  echo "✅ Pass: status=$status version=$version"
                  exit 0
                fi
                echo "Attempt $i/28: stale version (got $version_short, expected $EXPECTED_SHA), retrying in 15s..."
              else
                echo "Attempt $i/28: status=$status, retrying in 15s..."
              fi
            else
              # Surface curl's actual error so future silent failures are
              # diagnosable in 1 attempt instead of 32 (e.g. Cloudflare WAF
              # 403 on the runner IP, like Atlas hit — see Atlas PR #96).
              echo "Attempt $i/28: no response — $(cat /tmp/curl_err 2>/dev/null | head -1), retrying in 15s..."
            fi
            sleep 15
          done
          echo "::error::Smoke test failed after 28 attempts (7 min)"
          exit 1

  success-schedules:
    name: Consultant Success schedules
    if: inputs.schedule_action != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect or upsert schedules
        env:
          ACTION: ${{ inputs.schedule_action }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          api="$COOLIFY_URL/api/v1/applications/$COOLIFY_APP_UUID/scheduled-tasks"
          auth="Authorization: Bearer $COOLIFY_TOKEN"

          tasks=$(curl -fsSL -H "$auth" -H "Accept: application/json" "$api")
          echo "Existing schedules (commands intentionally redacted):"
          echo "$tasks" | jq 'map({uuid, name, frequency, container, timeout, enabled})'

          if [ "$ACTION" = "inspect" ]; then
            echo "Recent Consultant Success executions:"
            echo "$tasks" | jq -r '.[] | select(.name | startswith("consultant-success-")) | [.name, .uuid] | @tsv' |
              while IFS=$'\t' read -r task_name task_uuid; do
                executions=$(curl -fsSL -H "$auth" -H "Accept: application/json" "$api/$task_uuid/executions")
                echo "$executions" | jq --arg task "$task_name" '{task: $task, executions: (sort_by(.created_at) | reverse | .[:3] | map({uuid, status, created_at, finished_at, message}))}'
              done
            exit 0
          fi

          upsert_task() {
            name="$1"
            frequency="$2"
            command="$3"
            existing_uuid=$(echo "$tasks" | jq -r --arg name "$name" '.[] | select(.name == $name) | .uuid' | head -1)
            payload=$(jq -nc \
              --arg name "$name" \
              --arg frequency "$frequency" \
              --arg command "$command" \
              '{name: $name, frequency: $frequency, command: $command, container: "app", timeout: 300, enabled: true}')

            if [ -n "$existing_uuid" ]; then
              curl -fsSL -X PATCH -H "$auth" -H "Content-Type: application/json" \
                -d "$payload" "$api/$existing_uuid" >/dev/null
              echo "Updated $name ($existing_uuid)"
            else
              curl -fsSL -X POST -H "$auth" -H "Content-Type: application/json" \
                -d "$payload" "$api" >/dev/null
              echo "Created $name"
            fi
          }

          upsert_task \
            "consultant-success-plan" \
            "10 4 * * *" \
            'wget --quiet --output-document=- --header="Authorization: Bearer $CRON_SECRET" "https://compass.dynaminds.pl/api/cron/consultant-success-plan"'
          upsert_task \
            "consultant-success-dispatch" \
            "*/5 * * * *" \
            'wget --quiet --output-document=- --header="Authorization: Bearer $CRON_SECRET" "https://compass.dynaminds.pl/api/cron/consultant-success-dispatch"'

          verified=$(curl -fsSL -H "$auth" -H "Accept: application/json" "$api")
          echo "Verified Consultant Success schedules:"
          echo "$verified" | jq 'map(select(.name | startswith("consultant-success-")) | {uuid, name, frequency, container, timeout, enabled})'
