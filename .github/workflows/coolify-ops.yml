name: Coolify Ops

# Operational escape hatch for the Coolify deployment queue (analytics plan PR 0).
#
# Port of the NEXUS fix (Nexus PR #764) to the whole dynaminds fleet.
#
# Why this exists: on 2026-07-16 the deployment queue on the NEXUS Coolify
# instance wedged — every `/api/v1/deploy` call returned HTTP 429 "Deployment
# queue is full" for 12+ hours while prod silently stayed on a stale SHA.
# There is no SSH access to the server and the panel needs an interactive
# login, but GH Actions already holds a Coolify API token — so queue
# inspection and cancellation live here, next to the Deploy workflow that
# depends on them.
#
# Usage:
#   1. action=list                 → dump currently running/queued deployments
#                                    + the application's own status.
#   2. action=cancel, uuids="a b"  → POST /deployments/{uuid}/cancel for each.
#
# The list output contains only build metadata (UUIDs, SHAs, statuses,
# timestamps) — no env values or secrets.

# 2026-07-27 — extended with scheduled-task ops.
#
# The Coolify cron scheduler on this instance stopped firing entirely: the
# FORWARD_RECONCILE_RUN heartbeat (Phase 41b) produced zero rows across five
# mornings, inbox_sync_state.last_run_at has been NULL since May, and tc-sync
# has pulled nothing since June. The scheduled tasks live in the Coolify
# Postgres, which the API does not expose — hence SSH, using the Hetzner key
# GH Actions has held since April.
#
#   3. action=cron-list             → dump scheduled_tasks + scheduler health.
#   4. action=cron-enable           → re-enable every disabled task.
#   5. action=cron-restart          → restart the Coolify container (respawns
#                                     the Laravel scheduler).
#
# cron-list is read-only. Neither of the other two touches application data:
# they flip `enabled` in Coolify's own DB and bounce Coolify's own container.
#
# 2026-07-29 — added cron-disable-task (Phase 44).
#
#   6. action=cron-disable-task, task_name=X → flip `enabled` off for one task.
#
# Needed when an endpoint is retired but its schedule outlives it: cron-enable
# re-enables *everything*, so a retired task would silently come back on the next
# fleet-wide fix. Disables rather than deletes — the row stays as a record and one
# UPDATE brings it back.
#
# 2026-08-12 — added cron-secret-ciphertext (Phase 52).
#
#   7. action=cron-secret-ciphertext, secret_public_key=<repo Actions public key>
#      → print CRON_SECRET *encrypted* to that key, for the Actions secrets API.
#
# CRON_SECRET lives in the Coolify env vault; the GH Actions cron that calls
# /api/cron/* needs the same value as a repo secret. Only this runner can reach the
# server, and GITHUB_TOKEN cannot write Actions secrets (there is no such permission
# scope — storing a PAT to do it would trade one secret-handling problem for a worse
# one). So the runner prints the value sealed to the repository's public key: the
# ciphertext is useless to everyone except GitHub, which means it can safely pass
# through a log and a terminal, and the plaintext never leaves the server.
#
#   PK=$(gh api repos/artur-t-96/compass/actions/secrets/public-key --jq .key)
#   gh workflow run "Coolify Ops" -f action=cron-secret-ciphertext -f secret_public_key="$PK"
#   # then PUT the printed ENCRYPTED_VALUE with the matching key_id:
#   gh api -X PUT repos/artur-t-96/compass/actions/secrets/CRON_SECRET \
#     -f encrypted_value=<...> -f key_id=<...>

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [list, cancel, cron-list, cron-enable, cron-restart, cron-set-container, cron-curl-to-wget, cron-disable-task, cron-add, cron-secret-ciphertext, academy-runtime, academy-prepare, academy-seed, academy-activate]
        default: list
      deployment_uuids:
        description: "Space-separated deployment UUIDs to cancel (action=cancel)"
        required: false
        default: ""
      container:
        description: "Container name for scheduled tasks (action=cron-set-container)"
        required: false
        default: ""
      task_name:
        description: "scheduled_tasks.name to disable (action=cron-disable-task) / name for cron-add"
        required: false
        default: ""
      cron_frequency:
        description: "Cron expression for cron-add (e.g. '30 5 * * *')"
        required: false
        default: ""
      cron_endpoint:
        description: "Endpoint path segment for cron-add — /api/cron/<this> (e.g. tech-map-rotation)"
        required: false
        default: ""
      secret_public_key:
        description: "Repo Actions public key, base64 (action=cron-secret-ciphertext). Public data — safe as an input."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  academy-prepare:
    name: Prepare Academy host from a tested revision
    if: >-
      github.repository == 'B2B-net-S-A/COMPASS' &&
      (((inputs.action == 'academy-runtime' || inputs.action == 'academy-prepare' || inputs.action == 'academy-seed') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/academy-enterprise')) ||
      (inputs.action == 'academy-activate' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    concurrency:
      # Also excludes the existing main deployment while seeding before the
      # first Academy release installs its host-side deployment interlock.
      group: deploy-refs/heads/main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Require successful application and scanner checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in build-check.yml academy-malware.yml; do
            passed=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
              --workflow "$workflow" --status completed --limit 20 --json conclusion \
              --jq 'map(select(.conclusion == "success")) | length')
            if [ "$passed" -lt 1 ]; then
              echo "::error::No successful $workflow for this exact commit; host is unchanged."
              exit 1
            fi
          done
      - name: Install pinned scoped Node runtime without system packages
        if: inputs.action == 'academy-runtime'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [ "$HETZNER_HOST" = 178.104.220.48 ] && [ "$HETZNER_USER" = root ]
          task_work=$(mktemp -d)
          trap 'rm -rf -- "$task_work"' EXIT
          printf '%s\n' "$HETZNER_SSH_KEY" > "$task_work/key"
          printf '%s\n' '178.104.220.48 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFrtYvLwQUrw3GhnJs/y0LKt5maZ6qZVWpnb3bL9CRft' > "$task_work/known_hosts"
          curl --fail --silent --show-error --location --max-time 180 \
            https://nodejs.org/dist/v22.23.0/node-v22.23.0-linux-arm64.tar.gz -o "$task_work/node.tar.gz"
          printf '%s  %s\n' 0c96aa074abd109e0b5da8d10202a9bbcea9bcf9ddb587b20944f71b8f21f8c8 "$task_work/node.tar.gz" | sha256sum --check --status
          cp ops/academy/clamav/install-node-runtime.sh "$task_work/install-node-runtime.sh"
          tar -C "$task_work" -cf - install-node-runtime.sh node.tar.gz | timeout 300 ssh \
            -i "$task_work/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$task_work/known_hosts" \
            -o ConnectTimeout=15 -o LogLevel=ERROR root@178.104.220.48 \
            'set -eu; umask 077; stage=$(mktemp -d /opt/compass-academy-runtime-stage.XXXXXX); trap '\''rm -rf -- "$stage"'\'' EXIT; tar -xf - --no-same-owner --no-same-permissions -C "$stage"; bash "$stage/install-node-runtime.sh" - < "$stage/node.tar.gz"'
      - name: Transfer reviewed files and install without activation
        if: inputs.action == 'academy-prepare'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [ "$HETZNER_HOST" = 178.104.220.48 ] && [ "$HETZNER_USER" = root ]
          task_work=$(mktemp -d)
          trap 'rm -rf -- "$task_work"' EXIT
          printf '%s\n' "$HETZNER_SSH_KEY" > "$task_work/key"
          printf '%s\n' '178.104.220.48 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFrtYvLwQUrw3GhnJs/y0LKt5maZ6qZVWpnb3bL9CRft' > "$task_work/known_hosts"
          tar -C ops/academy/clamav -czf "$task_work/bundle.tgz" \
            install-host.sh install-host.mjs host-control.sh host-control.mjs host-control-core.mjs \
            activate-host.sh activate-host.mjs activation-app-check.mjs \
            worker-host.sh worker-request.mjs compose.daemon.proposal.yml compose.update.proposal.yml \
            clamd.conf clamd-health.conf freshclam.serialized.conf image-lock.json systemd
          timeout 180 ssh -i "$task_work/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$task_work/known_hosts" \
            -o ConnectTimeout=15 -o LogLevel=ERROR root@178.104.220.48 \
            'set -eu; umask 077; stage=$(mktemp -d /opt/compass-academy-stage.XXXXXX); trap '\''rm -rf -- "$stage"'\'' EXIT; tar -xzf - --no-same-owner --no-same-permissions -C "$stage"; bash "$stage/install-host.sh"' \
            < "$task_work/bundle.tgz"
          echo 'Academy files installed; no scanner, worker or timer was activated.'

      - name: Seed signatures with scanner stopped
        if: inputs.action == 'academy-seed'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [ "$HETZNER_HOST" = 178.104.220.48 ] && [ "$HETZNER_USER" = root ]
          task_work=$(mktemp -d)
          trap 'rm -rf -- "$task_work"' EXIT
          printf '%s\n' "$HETZNER_SSH_KEY" > "$task_work/key"
          printf '%s\n' '178.104.220.48 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFrtYvLwQUrw3GhnJs/y0LKt5maZ6qZVWpnb3bL9CRft' > "$task_work/known_hosts"
          timeout 1500 ssh -i "$task_work/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$task_work/known_hosts" \
            -o ConnectTimeout=15 -o LogLevel=ERROR root@178.104.220.48 \
            '/opt/compass-academy/host-control.sh seed' </dev/null

      - name: Activate Academy timers after deployed revision and scanner checks
        if: inputs.action == 'academy-activate'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [ "$HETZNER_HOST" = 178.104.220.48 ] && [ "$HETZNER_USER" = root ]
          task_work=$(mktemp -d)
          trap 'rm -rf -- "$task_work"' EXIT
          printf '%s\n' "$HETZNER_SSH_KEY" > "$task_work/key"
          printf '%s\n' '178.104.220.48 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFrtYvLwQUrw3GhnJs/y0LKt5maZ6qZVWpnb3bL9CRft' > "$task_work/known_hosts"
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" | timeout 180 ssh \
            -i "$task_work/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$task_work/known_hosts" \
            -o ConnectTimeout=15 -o LogLevel=ERROR root@178.104.220.48 \
            '/opt/compass-academy/activate-host.sh'

  ops:
    name: Coolify queue ops
    if: inputs.action != 'academy-runtime' && inputs.action != 'academy-prepare' && inputs.action != 'academy-seed' && inputs.action != 'academy-activate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List deployments + application status
        if: inputs.action == 'list'
        run: |
          echo "=== Currently running/queued deployments (instance-wide) ==="
          curl -sS \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Accept: application/json" \
            "${{ secrets.COOLIFY_URL }}/api/v1/deployments" \
            | jq 'if type == "array" then map({deployment_uuid, application_name, status, commit: (.commit // "" | .[0:10]), created_at, application_id}) else . end' \
            || echo "(request failed)"
          echo ""
          echo "=== Application status ==="
          curl -sS \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Accept: application/json" \
            "${{ secrets.COOLIFY_URL }}/api/v1/applications/${{ secrets.COOLIFY_APP_UUID }}" \
            | jq '{name, uuid, status, last_online_at, git_branch, git_commit_sha}' \
            || echo "(request failed)"

      - name: Cancel deployments
        if: inputs.action == 'cancel'
        run: |
          UUIDS="${{ inputs.deployment_uuids }}"
          if [ -z "$UUIDS" ]; then
            echo "::error::action=cancel requires deployment_uuids"
            exit 1
          fi
          rc=0
          for uuid in $UUIDS; do
            echo "Cancelling deployment $uuid ..."
            code=$(curl -sS -o /tmp/cancel_body -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              -H "Accept: application/json" \
              "${{ secrets.COOLIFY_URL }}/api/v1/deployments/$uuid/cancel" || echo "000")
            echo "HTTP $code — $(cat /tmp/cancel_body 2>/dev/null | head -c 500)"
            if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "204" ]; then
              echo "::warning::Cancel of $uuid returned HTTP $code"
              rc=1
            fi
          done
          exit $rc

      # ─── Scheduled-task ops (SSH into the Coolify host) ──────────────────
      # Coolify keeps schedules in its own Postgres and exposes no API for them,
      # so these steps go in over SSH. Each is guarded by `if:` so a run only
      # does the one thing it was asked to.
      - name: Set up SSH
        if: startsWith(inputs.action, 'cron-')
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "Key installed for ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}"

      - name: List scheduled tasks + scheduler health
        if: inputs.action == 'cron-list'
        env:
          SSH_TARGET: ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}
        run: |
          PSQL="docker exec coolify-db psql -U coolify -d coolify -P pager=off -c"

          echo "=== scheduled_tasks columns ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"select column_name from information_schema.columns where table_name='scheduled_tasks' order by ordinal_position;\"" || echo "(query failed)"

          echo ""
          echo "=== scheduled_tasks ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL 'select * from scheduled_tasks order by id;'" || echo "(query failed)"

          echo ""
          echo "=== running containers of the Compass application ==="
          # Coolify needs the exact container name when a compose stack has more
          # than one service (this one has app + alloy) — that is the whole cause
          # of "More than one container exists but no container name was provided".
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "docker ps --format '{{.Names}}' | grep -v '^coolify' | head -20" || echo "(failed)"

          echo ""
          echo "=== scheduled_task_executions (10 most recent) ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL 'select scheduled_task_id, status, created_at from scheduled_task_executions order by created_at desc limit 10;'" || echo "(query failed)"

          echo ""
          echo "=== why the failures failed (message of the 3 most recent) ==="
          # status alone says nothing about the cause; the job stores its output here.
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"select scheduled_task_id, status, created_at, left(coalesce(message,'(null)'), 600) as message from scheduled_task_executions where status = 'failed' order by created_at desc limit 3;\"" || echo "(query failed)"

          echo ""
          echo "=== coolify containers ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "docker ps --filter name=coolify --format '{{.Names}}\t{{.Status}}'" || echo "(failed)"

          echo ""
          echo "=== scheduler/worker processes inside coolify container ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "docker exec coolify ps aux | grep -E 'schedule|horizon' | grep -v grep" || echo "(no schedule/horizon process found)"

          echo ""
          echo "=== scheduler mentions in laravel.log ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "docker exec coolify tail -300 /var/www/html/storage/logs/laravel.log | grep -iE 'schedul|cron' | tail -20" || echo "(nothing)"

          echo ""
          echo "=== laravel.log tail, unfiltered ==="
          # A grep on 'schedul|cron' hides any *new* failure mode whose message
          # happens not to contain those words — which is exactly what happened
          # once the container name was filled in.
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "docker exec coolify tail -40 /var/www/html/storage/logs/laravel.log | cut -c1-300" || echo "(nothing)"

      # The actual failure mode found on 2026-07-27: the scheduler runs fine and
      # fires every task on time, but each one dies with "More than one container
      # exists but no container name was provided" (ScheduledTaskJob.php:136).
      # This compose stack has two services (app + alloy), so Coolify refuses to
      # guess which one the command belongs in. Naming it fixes every task at once.
      - name: Point scheduled tasks at a container
        if: inputs.action == 'cron-set-container'
        env:
          SSH_TARGET: ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}
          TARGET_CONTAINER: ${{ inputs.container }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          if [ -z "$TARGET_CONTAINER" ]; then
            echo "::error::action=cron-set-container requires the 'container' input"
            exit 1
          fi
          # The input is free text that ends up inside a SQL string, so constrain it
          # to the alphabet Docker actually allows for container names. Anything else
          # is rejected before it can reach the database.
          if ! printf '%s' "$TARGET_CONTAINER" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$'; then
            echo "::error::Refusing container name '$TARGET_CONTAINER' — allowed: letters, digits, _ . - (max 128)"
            exit 1
          fi
          PSQL="docker exec coolify-db psql -U coolify -d coolify -P pager=off -c"

          # scheduled_tasks is instance-wide, not per-application. Scope every write to
          # this app's own rows so a future second application on the same Coolify
          # instance can never be silently retargeted.
          SCOPE="application_id = (select id from applications where uuid = '$APP_UUID')"

          echo "=== before (this application only) ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"select id, name, container from scheduled_tasks where $SCOPE order by id;\""

          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"update scheduled_tasks set container = '$TARGET_CONTAINER' where (container is null or container = '') and $SCOPE;\""

          echo "=== after (this application only) ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"select id, name, container, enabled from scheduled_tasks where $SCOPE order by id;\""

      # Second failure mode, uncovered once the container name was filled in:
      #
      #   Job permanently failed after 1 attempts: sh: curl: not found
      #
      # The app image is Next.js standalone on Alpine and ships no curl. Every task
      # written before 2026-07 uses `curl`; the only two that ever worked
      # (consultant-success-*) use `wget`, which busybox does provide. That single
      # difference is why exactly those two ran while fifteen others died.
      #
      # Rewrites the command to match the working pattern, including the absolute
      # URL — the older tasks refer to "$APP_URL", which is not among the app's
      # runtime env vars (it has NEXT_PUBLIC_APP_URL), so leaving it would just swap
      # one silent failure for another.
      - name: Rewrite scheduled task commands from curl to wget
        if: inputs.action == 'cron-curl-to-wget'
        env:
          SSH_TARGET: ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          BASE_URL: ${{ vars.APP_URL }}
        run: |
          if ! printf '%s' "$BASE_URL" | grep -qE '^https://[a-zA-Z0-9.-]+$'; then
            echo "::error::APP_URL variable must be a bare https origin, got '$BASE_URL'"
            exit 1
          fi
          PSQL="docker exec coolify-db psql -U coolify -d coolify -P pager=off -c"
          SCOPE="application_id = (select id from applications where uuid = '$APP_UUID')"

          echo "=== before: how many tasks still use curl ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"select count(*) as curl_tasks from scheduled_tasks where command like 'curl %' and $SCOPE;\""

          # Two substitutions, both anchored so they cannot corrupt anything else:
          #   'curl -fsS -H '  → wget equivalent (the trailing space becomes '=')
          #   '"\$APP_URL/'    → the real origin
          # The bearer token inside the command is left untouched.
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"update scheduled_tasks set command = replace(replace(command, 'curl -fsS -H ', 'wget --quiet --output-document=- --header='), '\\\"\\\$APP_URL/', '\\\"$BASE_URL/') where command like 'curl %' and $SCOPE;\""

          echo "=== after ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"select id, name, left(command, 60) as command_head from scheduled_tasks where $SCOPE order by id;\""

          echo ""
          echo "=== anything still on curl, or still pointing at \$APP_URL? ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"select id, name from scheduled_tasks where (command like 'curl %' or command like '%APP_URL%') and $SCOPE;\""

      - name: Re-enable disabled scheduled tasks
        if: inputs.action == 'cron-enable'
        env:
          SSH_TARGET: ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          PSQL="docker exec coolify-db psql -U coolify -d coolify -P pager=off -c"
          # Same scoping rule as cron-set-container: never write outside this app's rows.
          SCOPE="application_id = (select id from applications where uuid = '$APP_UUID')"

          echo "=== before (this application only) ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"select id, name, enabled from scheduled_tasks where $SCOPE order by id;\""

          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"update scheduled_tasks set enabled = true where enabled is distinct from true and $SCOPE;\""

          echo "=== after (this application only) ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"select id, name, enabled from scheduled_tasks where $SCOPE order by id;\""

      # Phase 44 — the inbox-ingest schedule outlived its endpoint. Its route was
      # deleted with the Kanban↔mailbox integration, so every tick would now curl
      # a 404 forever. cron-enable cannot be used to clean this up: it re-enables
      # every row indiscriminately, which is exactly why a retired task has to be
      # switched off by name.
      - name: Disable one scheduled task by name
        if: inputs.action == 'cron-disable-task'
        env:
          SSH_TARGET: ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          TASK_NAME: ${{ inputs.task_name }}
        run: |
          if [ -z "$TASK_NAME" ]; then
            echo "::error::action=cron-disable-task requires the 'task_name' input"
            exit 1
          fi
          # Free text heading into a SQL string literal — constrain it to the
          # alphabet Coolify task names actually use before it can get there.
          if ! printf '%s' "$TASK_NAME" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,63}$'; then
            echo "::error::Refusing task name '$TASK_NAME' — allowed: letters, digits, _ . - (max 64)"
            exit 1
          fi
          PSQL="docker exec coolify-db psql -U coolify -d coolify -P pager=off -c"
          # Same scoping rule as every other write here: this app's rows only.
          SCOPE="application_id = (select id from applications where uuid = '$APP_UUID')"

          echo "=== before ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"select id, name, enabled from scheduled_tasks where $SCOPE order by id;\""

          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"update scheduled_tasks set enabled = false where name = '$TASK_NAME' and $SCOPE;\""

          echo "=== after ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"select id, name, enabled from scheduled_tasks where $SCOPE order by id;\""

      - name: Restart Coolify (respawn scheduler)
        if: inputs.action == 'cron-restart'
        env:
          SSH_TARGET: ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" "docker restart coolify"
          sleep 30
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "docker ps --filter name=coolify --format '{{.Names}}\t{{.Status}}'"
          echo ""
          echo "=== scheduler process after restart ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "docker exec coolify ps aux | grep -E 'schedule|horizon' | grep -v grep" || echo "(none)"

      # Registering a NEW scheduled task. There is no Coolify API for this that we
      # trust, so we INSERT into scheduled_tasks directly. Rather than hand-write a
      # command (and risk re-introducing the curl/$APP_URL/empty-container failures
      # that killed every task before 2026-07), we CLONE an existing, enabled,
      # wget-based task and swap only the endpoint path. That inherits the proven
      # command shape, the real bearer token, and container='app' by construction.
      #
      # Idempotent: a task with the same name is left untouched. Safe: if no working
      # template exists, zero rows are inserted and the step fails loudly rather than
      # creating a broken task. The scheduler picks up the new row within a minute,
      # no restart needed.
      - name: Add a scheduled task (clone a working wget task, swap endpoint)
        if: inputs.action == 'cron-add'
        env:
          SSH_TARGET: ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          TASK_NAME: ${{ inputs.task_name }}
          FREQ: ${{ inputs.cron_frequency }}
          ENDPOINT: ${{ inputs.cron_endpoint }}
        run: |
          if [ -z "$TASK_NAME" ] || [ -z "$FREQ" ] || [ -z "$ENDPOINT" ]; then
            echo "::error::cron-add requires task_name, cron_frequency and cron_endpoint"
            exit 1
          fi
          # Every input lands inside a SQL string literal, so each is constrained to a
          # strict allowlist before it can get there (same discipline as the other steps).
          if ! printf '%s' "$TASK_NAME" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,63}$'; then
            echo "::error::Refusing task name '$TASK_NAME' — allowed: letters, digits, _ . - (max 64)"
            exit 1
          fi
          if ! printf '%s' "$ENDPOINT" | grep -qE '^[a-z0-9-]{1,64}$'; then
            echo "::error::Refusing endpoint '$ENDPOINT' — allowed: lowercase letters, digits, - (max 64)"
            exit 1
          fi
          # Standard 5-field cron only — no ':' (that would let a typo like '30:5 * * *'
          # through and register a task that silently never fires).
          if ! printf '%s' "$FREQ" | grep -qE '^[0-9*/,-]+( [0-9*/,-]+){4}$'; then
            echo "::error::Refusing cron expression '$FREQ' — expected 5 space-separated fields"
            exit 1
          fi
          PSQL="docker exec coolify-db psql -U coolify -d coolify -P pager=off -tAc"
          PSQL_TBL="docker exec coolify-db psql -U coolify -d coolify -P pager=off -c"
          SCOPE="application_id = (select id from applications where uuid = '$APP_UUID')"

          echo "=== existing tasks (this application only) ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL_TBL \"select id, name, frequency, container, enabled from scheduled_tasks where $SCOPE order by id;\""

          # Idempotency: never create a second row with the same name. A dropped SSH
          # connection returns an empty string, not "0" — treat empty as a hard failure
          # so a flap can never masquerade as "already exists" and skip registration.
          EXISTING=$(ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"select count(*) from scheduled_tasks where name = '$TASK_NAME' and $SCOPE;\"") \
            || { echo "::error::SSH failed during idempotency check"; exit 1; }
          if [ -z "$EXISTING" ]; then
            echo "::error::Empty result from idempotency check — aborting rather than guessing"
            exit 1
          fi
          if [ "$EXISTING" != "0" ]; then
            echo "Task '$TASK_NAME' already exists ($EXISTING row) — nothing to do."
            exit 0
          fi

          # Clone the newest enabled wget task that hits /api/cron/, swapping the path.
          # INSERT ... SELECT inserts zero rows if no template matches — caught below.
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"insert into scheduled_tasks (uuid, name, command, frequency, container, application_id, team_id, enabled, timeout, created_at, updated_at) select gen_random_uuid(), '$TASK_NAME', regexp_replace(command, '/api/cron/[a-z0-9-]+', '/api/cron/$ENDPOINT'), '$FREQ', 'app', application_id, team_id, true, timeout, now(), now() from scheduled_tasks where $SCOPE and enabled = true and command like '%wget %' and command like '%/api/cron/%' order by id desc limit 1;\"" \
            || { echo "::error::SSH failed during INSERT — task may or may not exist, re-run to converge"; exit 1; }

          CREATED=$(ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL \"select count(*) from scheduled_tasks where name = '$TASK_NAME' and $SCOPE;\"") \
            || { echo "::error::SSH failed during post-INSERT verification"; exit 1; }
          if [ -z "$CREATED" ] || [ "$CREATED" = "0" ]; then
            echo "::error::Task not created — no enabled wget /api/cron/ task to clone (or empty result). Register one working task first."
            exit 1
          fi

          # Print only the extracted /api/cron/<path>, never the command itself — the
          # bearer token sits in the middle of the command and GitHub will not mask it.
          echo "=== after: new task (endpoint extracted, token never printed) ==="
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "$PSQL_TBL \"select id, name, frequency, container, enabled, substring(command from '/api/cron/[a-z0-9-]+') as endpoint from scheduled_tasks where name = '$TASK_NAME' and $SCOPE;\""

      - name: Print CRON_SECRET encrypted to the repo public key
        if: inputs.action == 'cron-secret-ciphertext'
        env:
          SSH_TARGET: ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          PUBLIC_KEY: ${{ inputs.secret_public_key }}
        run: |
          if [ -z "$PUBLIC_KEY" ]; then
            echo "::error::action=cron-secret-ciphertext requires 'secret_public_key' (gh api repos/{owner}/{repo}/actions/secrets/public-key --jq .key)"
            exit 1
          fi

          CONTAINER=$(ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "docker ps --format '{{.Names}}' | grep '^app-$APP_UUID' | head -1") \
            || { echo "::error::SSH failed while listing containers"; exit 1; }
          if [ -z "$CONTAINER" ]; then
            echo "::error::No running container matching app-$APP_UUID"
            exit 1
          fi
          echo "Reading CRON_SECRET from $CONTAINER"

          VALUE=$(ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" \
            "docker exec $CONTAINER printenv CRON_SECRET") \
            || { echo "::error::SSH failed while reading CRON_SECRET"; exit 1; }
          # Mask first, ask questions second: this value did NOT come from secrets.*,
          # so nothing masks it automatically and any later `set -x` would leak it.
          echo "::add-mask::$VALUE"
          if [ -z "$VALUE" ]; then
            echo "::error::CRON_SECRET is empty in $CONTAINER — nothing to encrypt"
            exit 1
          fi

          python3 -m pip install --quiet pynacl 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages pynacl \
            || { echo "::error::Could not install pynacl"; exit 1; }

          # Value goes in via env, never argv — argv is visible in `ps` to anything
          # else running on the runner.
          SECRET_VALUE="$VALUE" python3 - <<'PY'
          import base64, os
          from nacl import encoding, public

          pk = public.PublicKey(os.environ["PUBLIC_KEY"].encode("utf-8"), encoding.Base64Encoder())
          sealed = public.SealedBox(pk).encrypt(os.environ["SECRET_VALUE"].encode("utf-8"))
          # Safe to print: a sealed box is decryptable only with the repository's
          # private key, which never leaves GitHub.
          print("ENCRYPTED_VALUE=" + base64.b64encode(sealed).decode("utf-8"))
          PY
