name: E2E tests (Playwright)

# Audyt 2026-08 (A0.5): `BASE_URL` był ustawiany na sekret NEXT_PUBLIC_APP_URL,
# czyli PRODUKCJĘ — a zestaw zawiera testy piszące (e2e/04-rls-database.spec.ts
# robi POST /auth/v1/signup). Automatyczny wyzwalacz i tak nie działa od
# 2026-05-04: nasłuchuje workflow o nazwie "Deploy to Hetzner", która wtedy
# zniknęła (realna to "Deploy"). NIE naprawiamy go tutaj — naprawa włączyłaby
# testy piszące przeciw produkcji po każdym merge'u. Trigger wraca dopiero
# razem z osobnym środowiskiem testowym (pozycja B5 planu naprawy).
#
# Zostaje ręczne uruchomienie, ale adres trzeba podać JAWNIE — bez domyślnej
# produkcji.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Adres testowanej instancji (WYMAGANY). Uwaga: zestaw zawiera testy piszące — nie wskazuj produkcji bez świadomej decyzji.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./COMPASS
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: COMPASS/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Audyt 2026-09-22 (O04): e2e/04-rls-database.spec.ts wymaga SUPABASE_URL
      # i SUPABASE_ANON_KEY już przy IMPORCIE pliku — workflow ich nie podawał,
      # więc Playwright kończył na kolekcji („Total: 0 tests") zanim cokolwiek
      # uruchomił. Wartości MUSZĄ wskazywać projekt Supabase tej samej instancji
      # co `base_url` — sekrety E2E_SUPABASE_URL / E2E_SUPABASE_ANON_KEY
      # (repo → Settings → Secrets → Actions). Brak fallbacku na produkcyjne
      # NEXT_PUBLIC_SUPABASE_* celowo: testy mają trafić w środowisko testowe.
      - name: Preflight — env + test collection
        env:
          BASE_URL: ${{ inputs.base_url }}
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          missing=""
          for name in BASE_URL SUPABASE_URL SUPABASE_ANON_KEY TEST_USER_EMAIL TEST_USER_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Brak wymaganych zmiennych E2E:$missing (sekrety E2E_SUPABASE_URL, E2E_SUPABASE_ANON_KEY, TEST_USER_EMAIL, TEST_USER_PASSWORD + input base_url)."
            exit 1
          fi
          # Kolekcja bez sieci: łapie błędy importu (np. brak env w specu)
          # zanim ruszy przeglądarka. 0 zebranych testów = porażka.
          set -o pipefail
          npx playwright test --list | tee /tmp/pw-list.txt
          if ! grep -qE '^Total: [1-9][0-9]* tests?' /tmp/pw-list.txt; then
            echo "::error::Playwright nie zebrał żadnego testu — sprawdź log kolekcji powyżej."
            exit 1
          fi

      - name: Run Playwright smoke tests
        env:
          BASE_URL: ${{ inputs.base_url }}
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: COMPASS/playwright-report
          retention-days: 14
