name: E2E tests (Playwright)

# Audyt 2026-08 (A0.5): `BASE_URL` był ustawiany na sekret NEXT_PUBLIC_APP_URL,
# czyli PRODUKCJĘ — a zestaw zawiera testy piszące (e2e/04-rls-database.spec.ts
# robi POST /auth/v1/signup). Automatyczny wyzwalacz i tak nie działa od
# 2026-05-04: nasłuchuje workflow o nazwie "Deploy to Hetzner", która wtedy
# zniknęła (realna to "Deploy"). NIE naprawiamy go tutaj — naprawa włączyłaby
# testy piszące przeciw produkcji po każdym merge'u. Trigger wraca dopiero
# razem z osobnym środowiskiem testowym (pozycja B5 planu naprawy).
#
# Zostaje ręczne uruchomienie, ale adres trzeba podać JAWNIE — bez domyślnej
# produkcji.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Adres testowanej instancji (WYMAGANY). Uwaga: zestaw zawiera testy piszące — nie wskazuj produkcji bez świadomej decyzji.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./COMPASS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: COMPASS/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        env:
          BASE_URL: ${{ inputs.base_url }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: COMPASS/playwright-report
          retention-days: 14
