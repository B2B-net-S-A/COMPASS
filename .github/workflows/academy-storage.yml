name: Academy real Supabase Storage
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'COMPASS/supabase/migrations/**'
      - 'COMPASS/lib/academy/**'
      - 'COMPASS/lib/actions/academy-materials.ts'
      - 'COMPASS/scripts/**'
      - 'COMPASS/package*.json'
      - 'ops/academy/storage/**'
      - '.github/workflows/academy-storage.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academy-storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storage:
    name: Supabase ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        # Upgrade/backfill runs in build-check's real PostgreSQL job. Operational
        # legacy seeds have a separate, explicitly nonqualifying manual audit.
        mode: [academy-fixture]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: COMPASS/package-lock.json
      - name: Verify disposable historical migration ordering
        run: node --test ops/academy/storage/prepare-history.test.mjs
      - name: Install locked fixture and production transport dependencies
        if: matrix.mode == 'academy-fixture'
        working-directory: COMPASS
        run: npm ci
      - name: Validate export boundary and final RPC contracts without Docker
        if: matrix.mode == 'academy-fixture'
        run: node --test ops/academy/storage/gate.test.mjs
      - name: Real Auth, Storage, PostgREST and isolated backup/restore on disposable hosted containers
        run: bash ops/academy/storage/run-hosted-gate.sh '${{ matrix.mode }}'
