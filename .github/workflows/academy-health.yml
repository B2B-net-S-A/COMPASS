name: Academy operations watchdog

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academy-health
  cancel-in-progress: false

jobs:
  health:
    if: github.repository == 'B2B-net-S-A/COMPASS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: ops/academy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Verify read-only watchdog contracts
        run: node --test ops/academy/health-watchdog.test.mjs ops/academy/watchdog-schedule-audit.test.mjs ops/academy/grafana-schedule-check.test.mjs
      - name: Check Academy workers, scanner, queues and host disk
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: node ops/academy/health-watchdog.mjs
