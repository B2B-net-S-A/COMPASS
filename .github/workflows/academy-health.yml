name: Academy operations watchdog

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academy-health
  cancel-in-progress: false

jobs:
  health:
    if: github.repository == 'B2B-net-S-A/COMPASS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          sparse-checkout: ops/academy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify read-only watchdog contracts
        run: node --test ops/academy/health-watchdog.test.mjs ops/academy/watchdog-schedule-audit.test.mjs
      - name: Check Academy workers, scanner, queues and host disk
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: node ops/academy/health-watchdog.mjs
