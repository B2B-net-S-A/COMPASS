name: NEXUS contractors sync (DORMANT — manual only)

# Most tożsamości NEXUS↔Compass — scheduler trasy /api/cron/nexus-contractors-sync.
#
# STAN: DORMANT (tylko workflow_dispatch). Świadomie BEZ `schedule:`, bo most nie
# jest jeszcze uruchomiony — trasa zwraca 500 (`stage:config`), dopóki w Coolify
# nie ma NEXUS_CONTRACTORS_URL + NEXUS_CONTRACTORS_API_KEY, a NEXUS nie wystawia
# eksportu kontraktorów. Auto-harmonogram teraz = codzienne czerwone runy + szum
# w Sentry (`nexus_contractors_not_configured`). Ten krok dodaje podpowiedzi po
# nazwisku do kolejki People Ops → „Tożsamość NEXUS"; dopóki nie ruszy, kolejka
# jest pusta i nic nie linkuje.
#
# JAK AKTYWOWAĆ MOST (kolejność):
#   1. [NEXUS] wystaw endpoint eksportu kontraktorów (paginowany {items,has_more},
#      item: nexus_contract_id, candidate{name,lastname,email}, client_name, status,
#      start_date, end_date, lacks_current_order).
#   2. [env] dodaj do Coolify (workflow „Coolify set env", value_from_secret):
#        NEXUS_CONTRACTORS_URL      (adres z p.1)
#        NEXUS_CONTRACTORS_API_KEY  (nagłówek X-API-Key)
#   3. Odpal ten workflow ręcznie (Run workflow) i sprawdź podsumowanie:
#        200 + {linked, pending, ambiguous, not_found} → most działa.
#        „stage:config" → env jeszcze nieustawione (workflow zostaje zielony, dormant).
#   4. Przejdź kolejkę „Tożsamość NEXUS" (People Ops) i pozostaw linked/not_found.
#   5. Gdy przebieg jest stabilny — ODKOMENTUJ `schedule:` poniżej (minuta ≠ :00)
#      i wtedy zamień nagłówek na zwykły „(daily cron)". Nie planuj równolegle
#      w Coolify — jeden scheduler (crony Coolify są zawodne, patrz saga martwych cronów).
#
# Wzór end-to-end: cron-legal-monitor-alerts.yml (Bearer CRON_SECRET, graceful skip).

on:
  # schedule:
  #   # Po aktywacji: raz dziennie ~04:37 UTC (poza szczytem pełnej godziny).
  #   - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-contractors-sync
  cancel-in-progress: false

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Curl /api/cron/nexus-contractors-sync
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Brak zmiennej APP_URL — ustaw ją w ustawieniach repo."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Pominięte — brak sekretu CRON_SECRET. Bez niego trasa cron odrzuca żądanie (401)."
            exit 0
          fi
          echo "Calling $APP_URL/api/cron/nexus-contractors-sync"
          # Bearer, nie ?secret= — sekret w query trafia do logów CF/proxy/Sentry.
          # Bez -f, bo chcemy rozróżnić 500 „stage:config" (most jeszcze nieustawiony,
          # zielono) od realnej awarii (czerwono).
          resp=$(curl -sS -m 90 --retry 2 --retry-delay 10 -w $'\n%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/nexus-contractors-sync") || true
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "HTTP $code"
          echo "$body"
          if [ "$code" = "200" ]; then
            echo "✅ Sync NEXUS↔Compass wykonany. Sprawdź kolejkę People Ops → Tożsamość NEXUS."
            exit 0
          fi
          if printf '%s' "$body" | grep -q '"stage":"config"'; then
            echo "::warning::Most tożsamości NIE jest jeszcze skonfigurowany — ustaw NEXUS_CONTRACTORS_URL + NEXUS_CONTRACTORS_API_KEY w Coolify (workflow „Coolify set env"). Scheduler pozostaje dormant."
            exit 0
          fi
          echo "::error::Sync nexus-contractors zwrócił HTTP $code (nie stage:config)."
          exit 1
