name: Cron — NEXUS contractors sync

# Drugi scheduler (obok zadania w Coolify) dla /api/cron/nexus-contractors-sync:
# pobiera kontraktorów z NEXUSA i dopina im tożsamość (nexus_match_status).
# Wzorzec 1:1 z cron-timesheet-reminder.yml — Bearer CRON_SECRET, APP_URL z var.
#
# Trasa dopina tożsamość idempotentnie (upsert po id, grupowany po werdykcie),
# więc redundancja z ewentualnym zadaniem Coolify jest bezpieczna. Bez sekretu
# CRON_SECRET workflow daje ostrzeżenie i zielony przebieg, nie czerwony.
# Rotacja wartości: action=cron-secret-ciphertext w workflow „Coolify Ops".

on:
  schedule:
    # Codziennie 06:00 UTC (≈ 07:00 / 08:00 w Warszawie zależnie od DST).
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-contractors-sync
  cancel-in-progress: false

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Curl /api/cron/nexus-contractors-sync
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Brak zmiennej APP_URL — ustaw ją w ustawieniach repo."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Pominięte — brak sekretu CRON_SECRET. Dodaj sekret, żeby scheduler ruszył."
            exit 0
          fi
          echo "Calling $APP_URL/api/cron/nexus-contractors-sync"
          # Bearer, nie ?secret= — sekret w query trafia do logów CF/proxy/Sentry.
          curl -fsSL --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/nexus-contractors-sync" | tee /tmp/result.json
          echo
          echo "✅ NEXUS contractors sync completed."
