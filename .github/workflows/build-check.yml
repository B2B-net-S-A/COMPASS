name: Build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Typecheck + Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./APK-COMPASS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: APK-COMPASS/package-lock.json

      - name: Install deps
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Next build (placeholder env)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://placeholder.example.com
        run: npm run build
