name: Build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  typecheck-and-build:
    name: Typecheck + Lint + Test + Build
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: ./COMPASS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: COMPASS/package-lock.json

      - name: Install deps
        run: npm ci

      # Report-only (audyt B6). Sygnalizuje, nie blokuje — w chwili dodania
      # zostało 8 podatności i WSZYSTKIE wiszą na migracji Next 14→16
      # (docs/next-15-16-migration-plan.md). Blokujący próg zamurowałby każdy
      # PR do czasu tej migracji, więc `continue-on-error` zostaje do momentu
      # rozładowania zatoru — wtedy zdejmij tę linię, żeby próg zaczął działać.
      - name: npm audit (report-only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: ESLint (next lint)
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Vitest unit tests
        run: npm run test:unit

      - name: Availability connection scope tests
        run: python3 ../scripts/test_configure_nexus_availability.py

      - name: Next build (placeholder env)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://placeholder.example.com
        run: npm run build

  security-scan:
    name: Trivy + hadolint (report-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # Report-only first pass — flip continue-on-error:false / exit-code:'1' after triaging findings.
      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: COMPASS/Dockerfile
          failure-threshold: warning
        continue-on-error: true
      - name: Trivy filesystem scan (deps + Dockerfile misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: .claude,node_modules
          exit-code: '0'
