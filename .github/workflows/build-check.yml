name: Build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  typecheck-and-build:
    name: Typecheck + Lint + Test + Build
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: ./COMPASS
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: COMPASS/package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint (next lint)
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Vitest unit tests
        run: npm run test:unit

      - name: Release tooling tests
        run: npm run test:release

      - name: Next build (placeholder env)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://placeholder.example.com
          GIT_SHA: ${{ github.sha }}
          BUILT_AT: '1970-01-01T00:00:00Z'
        run: npm run build

  database-replay:
    name: Fresh database replay + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: secret-scan
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The reconciliation checker compares every historical source with
          # the locked pre-reconciliation commit.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Assert migration filename and credential invariants
        run: npm --prefix COMPASS run db:migrations:check

      - name: Replay all migrations on fresh PostgreSQL
        run: |
          supabase db start --workdir COMPASS
          supabase db reset --workdir COMPASS --local --no-seed

      - name: Run migration reconciliation pgTAP
        run: >-
          supabase test db --workdir COMPASS --local
          COMPASS/supabase/tests/migration_reconciliation.sql

      - name: Lint reconstructed schemas
        run: >-
          supabase db lint --workdir COMPASS --local
          --schema public,compass_legacy --level warning --fail-on error

      - name: Block Security Advisor errors
        run: >-
          supabase db advisors --workdir COMPASS --local
          --type security --level error --fail-on error

      - name: Stop local Supabase
        if: always()
        run: supabase stop --workdir COMPASS --no-backup || true

  security-scan:
    name: Trivy + hadolint (report-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Report-only first pass — flip continue-on-error:false / exit-code:'1' after triaging findings.
      - name: Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: COMPASS/Dockerfile
          failure-threshold: warning
        continue-on-error: true
      - name: Trivy filesystem scan (deps + Dockerfile misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: .claude,node_modules
          exit-code: '0'

  standards-drift:
    name: Standards drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Read pinned standards manifest
        id: standards
        run: |
          echo "mode=$(jq -r '.mode' .github/standards/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "repository=$(jq -r '.sourceRepository' .github/standards/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r '.sourceRef // ""' .github/standards/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned central standards
        if: steps.standards.outputs.mode == 'enforced'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ steps.standards.outputs.repository }}
          ref: ${{ steps.standards.outputs.ref }}
          token: ${{ secrets.ENGINEERING_STANDARDS_READ_TOKEN }}
          path: .engineering-standards
          persist-credentials: false

      - name: Compare generated baseline
        env:
          REPO_ROOT: ${{ github.workspace }}
          STANDARDS_DIR: ${{ steps.standards.outputs.mode == 'enforced' && format('{0}/.engineering-standards', github.workspace) || '' }}
        run: node COMPASS/scripts/check-standards-drift.mjs

  docker-build-smoke:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build immutable image
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key \
            --build-arg NEXT_PUBLIC_APP_URL=https://placeholder.example.com \
            --build-arg GIT_SHA="$GIT_SHA" \
            --build-arg BUILT_AT="$BUILT_AT" \
            --tag "compass-ci:$GIT_SHA" \
            --file COMPASS/Dockerfile \
            COMPASS

  quality-gate:
    name: quality-gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - typecheck-and-build
      - security-scan
      - standards-drift
      - docker-build-smoke
    steps:
      - name: Require every gate job to pass
        env:
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          TYPECHECK_BUILD: ${{ needs.typecheck-and-build.result }}
          SECURITY_SCAN: ${{ needs.security-scan.result }}
          STANDARDS_DRIFT: ${{ needs.standards-drift.result }}
          DOCKER_BUILD: ${{ needs.docker-build-smoke.result }}
        run: |
          for result in "$SECRET_SCAN" "$TYPECHECK_BUILD" "$SECURITY_SCAN" "$STANDARDS_DRIFT" "$DOCKER_BUILD"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required quality job ended with result: $result"
              exit 1
            fi
          done
