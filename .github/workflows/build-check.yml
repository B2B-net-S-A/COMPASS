name: Build check

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  typecheck-and-build:
    name: Typecheck + Lint + Test + Build
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: ./COMPASS
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: COMPASS/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Dependency audit (HIGH/CRITICAL)
        run: npm audit --audit-level=high

      - name: ESLint (next lint)
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Vitest unit tests
        run: npm run test:unit

      - name: Release tooling tests
        run: npm run test:release

      - name: Next build (placeholder env)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://placeholder.example.com
          GIT_SHA: ${{ github.sha }}
          BUILT_AT: '1970-01-01T00:00:00Z'
        run: npm run build

  security-scan:
    name: Hadolint + Trivy security evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: COMPASS/Dockerfile
          failure-threshold: warning
      - name: Trivy filesystem misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          skip-dirs: .claude,node_modules
          exit-code: '1'

  standards-drift:
    name: Standards drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate immutable standard, action pins, and exceptions
        uses: artur-t-96/engineering-standards/.github/actions/validate-consumer@5f5808c228b756024816850103b0436b765a80b3
        with:
          expected-ref: 5f5808c228b756024816850103b0436b765a80b3
          consumer-root: .

  docker-build-smoke:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build immutable image
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key \
            --build-arg NEXT_PUBLIC_APP_URL=https://placeholder.example.com \
            --build-arg GIT_SHA="$GIT_SHA" \
            --build-arg BUILT_AT="$BUILT_AT" \
            --tag "compass-ci:$GIT_SHA" \
            --file COMPASS/Dockerfile \
            COMPASS

      - name: Start final image for process smoke
        env:
          GIT_SHA: ${{ github.sha }}
        run: >-
          docker run --detach --rm
          --name compass-ci-livez
          --publish 127.0.0.1:10000:10000
          "compass-ci:$GIT_SHA"

      - name: Validate shared livez contract
        uses: artur-t-96/engineering-standards/.github/actions/validate-health@5f5808c228b756024816850103b0436b765a80b3
        with:
          url: http://127.0.0.1:10000/api/livez
          kind: livez
          expected-sha: ${{ github.sha }}
          samples: '10'
          interval: '2'
          failure-threshold: '10'
          success-threshold: '1'

      - name: Smoke App Router pages
        run: |
          login_status="$(curl --fail --silent --show-error --max-time 10 \
            --output /tmp/compass-login.html \
            --write-out '%{http_code}' \
            http://127.0.0.1:10000/login)"
          test "$login_status" = '200'
          grep --fixed-strings --quiet '<title>COMPASS' /tmp/compass-login.html

          protected_status="$(curl --silent --show-error --max-time 10 \
            --dump-header /tmp/compass-protected.headers \
            --output /dev/null \
            --write-out '%{http_code}' \
            http://127.0.0.1:10000/internal)"
          test "$protected_status" = '307'
          tr -d '\r' < /tmp/compass-protected.headers > /tmp/compass-protected.normalized.headers
          grep --ignore-case --fixed-strings --line-regexp --quiet \
            'location: /login' \
            /tmp/compass-protected.normalized.headers

      - name: Trivy final image scan (vulnerabilities + secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: compass-ci:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Stop process-smoke container
        if: always()
        run: docker rm --force compass-ci-livez

  quality-gate:
    name: quality-gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - typecheck-and-build
      - security-scan
      - standards-drift
      - docker-build-smoke
    steps:
      - name: Require every gate job to pass
        env:
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          TYPECHECK_BUILD: ${{ needs.typecheck-and-build.result }}
          SECURITY_SCAN: ${{ needs.security-scan.result }}
          STANDARDS_DRIFT: ${{ needs.standards-drift.result }}
          DOCKER_BUILD: ${{ needs.docker-build-smoke.result }}
        run: |
          for result in "$SECRET_SCAN" "$TYPECHECK_BUILD" "$SECURITY_SCAN" "$STANDARDS_DRIFT" "$DOCKER_BUILD"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required quality job ended with result: $result"
              exit 1
            fi
          done
