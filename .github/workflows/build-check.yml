name: Build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks CLI
        run: |
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            range="$HEAD_SHA"
          else
            range="$BASE_SHA..$HEAD_SHA"
          fi
          gitleaks git --config .gitleaks.toml --redact --exit-code 1 --log-opts="$range" .

  typecheck-and-build:
    name: Typecheck + Lint + Test + Build
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: ./COMPASS
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: COMPASS/package-lock.json

      - name: Install deps
        run: npm ci

      # Report-only (audyt B6). Sygnalizuje, nie blokuje — w chwili dodania
      # zostało 8 podatności i WSZYSTKIE wiszą na migracji Next 14→16
      # (docs/next-15-16-migration-plan.md). Blokujący próg zamurowałby każdy
      # PR do czasu tej migracji, więc `continue-on-error` zostaje do momentu
      # rozładowania zatoru — wtedy zdejmij tę linię, żeby próg zaczął działać.
      - name: npm audit (report-only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: ESLint (next lint)
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Vitest unit tests
        run: npm run test:unit

      - name: Academy migration and authorization contracts
        run: npm run test:academy-db

      - name: Academy learner history pagination
        run: node scripts/test-academy-enrollments-pagination-db.mjs

      - name: Academy learner waitlist and next-session overview
        run: node scripts/test-academy-my-run-overview-db.mjs

      - name: Academy M365 identity pagination
        run: node scripts/test-academy-m365-identities-pagination-db.mjs

      - name: Academy read-only watchdog contracts
        run: node --test ../ops/academy/health-watchdog.test.mjs ../ops/academy/watchdog-schedule-audit.test.mjs

      - name: Academy offline restore verifier
        run: node --test ../ops/academy/restore/verify.test.mjs

      - name: Availability connection scope tests
        run: python3 ../scripts/test_configure_nexus_availability.py

      - name: Next build (placeholder env)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://placeholder.example.com
        run: npm run build

  academy-postgres:
    name: Academy PostgreSQL authorization and concurrency
    runs-on: ubuntu-latest
    needs: secret-scan
    services:
      postgres:
        # Matches the production vector extension version; registry digest verified over HTTPS.
        image: pgvector/pgvector:0.8.0-pg17@sha256:40b404964359299eefdd5f8518facf1886c562848cf4de13b6eaf91cb70c2b87
        env:
          POSTGRES_DB: academy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-academy-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./COMPASS
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: COMPASS/package-lock.json
      - run: npm ci
      - name: Real PostgreSQL migration, RLS and simultaneous requests
        env:
          ACADEMY_TEST_DATABASE_URL: postgresql://postgres:isolated-academy-ci@localhost:5432/academy_test
        run: npm run test:academy-db
      - name: Real PostgreSQL learner history pagination
        env:
          ACADEMY_TEST_DATABASE_URL: postgresql://postgres:isolated-academy-ci@localhost:5432/academy_test
        run: node scripts/test-academy-enrollments-pagination-db.mjs
      - name: Real PostgreSQL learner waitlist and next-session overview
        env:
          ACADEMY_TEST_DATABASE_URL: postgresql://postgres:isolated-academy-ci@localhost:5432/academy_test
        run: node scripts/test-academy-my-run-overview-db.mjs
      - name: Real PostgreSQL M365 identity pagination
        env:
          ACADEMY_TEST_DATABASE_URL: postgresql://postgres:isolated-academy-ci@localhost:5432/academy_test
        run: node scripts/test-academy-m365-identities-pagination-db.mjs

  security-scan:
    name: Trivy + hadolint (report-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Report-only first pass — flip continue-on-error:false / exit-code:'1' after triaging findings.
      - name: Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: COMPASS/Dockerfile
          failure-threshold: warning
        continue-on-error: true
      - name: Trivy filesystem scan (deps + Dockerfile misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: .claude,node_modules
          exit-code: '0'
