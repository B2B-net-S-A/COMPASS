name: Build and verify (Coolify-managed deploy)

# Coolify (na compass-prod) zarządza deploymentem od 2026-05-01.
# GHA build-and-push do GHCR jest redundant backupem — Coolify buduje sam z git source.
# Auto-deploy webhook (Coolify) jeszcze nie skonfigurowany (port 8000 nie public).
# Po push do main: ręczny "Deploy" w Coolify panel: http://178.104.220.48:8000
#   (przez SSH tunnel: ssh -L 8000:127.0.0.1:8000 root@178.104.220.48)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push image (GHCR backup)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - name: Compute build metadata
        id: meta-build
        run: |
          echo "git_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./APK-COMPASS
          file: ./APK-COMPASS/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            GIT_SHA=${{ steps.meta-build.outputs.git_sha }}
            BUILT_AT=${{ steps.meta-build.outputs.built_at }}

  smoke-test:
    name: Smoke test current deployment
    runs-on: ubuntu-latest
    steps:
      # Coolify deploy jest manual — może się nie odbyć przed smoke testem.
      # Sprawdzamy tylko że produkcja odpowiada healthy (niekoniecznie ten commit).
      - name: Health check (status != unhealthy)
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          for i in 1 2 3 4 5; do
            response=$(curl -fsSL "$APP_URL/api/health" || echo '')
            if [ -n "$response" ]; then
              status=$(echo "$response" | jq -r '.status // "missing"')
              if [ "$status" = "healthy" ] || [ "$status" = "degraded" ]; then
                echo "Health check passed: $response"
                exit 0
              fi
              echo "Attempt $i: status=$status, retrying in 15s..."
            else
              echo "Attempt $i: no response, retrying in 15s..."
            fi
            sleep 15
          done
          echo "::error::Health check failed after 5 attempts"
          exit 1
