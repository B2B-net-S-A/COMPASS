# Isolated hosted-CI project only. Never copy to a linked production project.
project_id = "academy-storage-ci"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[db.migrations]
enabled = true
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = false
[storage]
enabled = true
file_size_limit = "1GiB"
[studio]
enabled = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
