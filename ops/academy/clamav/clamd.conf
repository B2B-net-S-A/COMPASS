# Private network only: clamd has no authentication or transport encryption.
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /scan-tmp
PidFile /tmp/clamd.pid
LogTime yes
LogClean no
LogVerbose no
LogSyslog no

# One scan at a time. Signature reload blocks briefly instead of allocating a second engine.
MaxThreads 1
MaxQueue 2
MaxConnectionQueueLength 8
ConcurrentDatabaseReload no
ReadTimeout 240
CommandReadTimeout 10
SendBufTimeout 500
IdleTimeout 30
MaxScanTime 180000

# Compass accepts <=1 GiB. The small daemon margin avoids an equality-boundary mismatch.
StreamMaxLength 1100M
MaxFileSize 1100M
MaxScanSize 2048M
MaxRecursion 16
MaxFiles 10000
AlertExceedsMax yes
AlertEncrypted yes
HeuristicAlerts yes
ScanArchive yes
ScanPDF yes
ScanOLE2 yes

OfficialDatabaseOnly yes
FailIfCvdOlderThan 2
SelfCheck 600
