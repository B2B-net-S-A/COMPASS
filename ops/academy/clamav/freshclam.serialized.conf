# One-shot updater while clamd is stopped. No NotifyClamd and no daemon mode.
# The external orchestrator schedules this every two hours under the build lock.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net
MaxAttempts 3
ConnectTimeout 20
ReceiveTimeout 120
TestDatabases yes
ScriptedUpdates yes
LogTime yes
LogVerbose no
