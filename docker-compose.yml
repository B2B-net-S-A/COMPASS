services:
  app:
    build:
      context: ./COMPASS
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        # Immutable release metadata. Compose fails closed when release tooling
        # did not provide the exact source SHA and UTC build timestamp.
        GIT_SHA: ${GIT_SHA:?GIT_SHA must be a full 40-character commit SHA}
        BUILT_AT: ${BUILT_AT:?BUILT_AT must be an ISO-8601 UTC timestamp}
        # Sentry build-time args. DSN is public (browser bundle); auth token is
        # supplied separately as a BuildKit secret below.
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      secrets:
        - SENTRY_AUTH_TOKEN
    image: compass-app:${GIT_SHA:?GIT_SHA must be a full 40-character commit SHA}
    container_name: compass-app
    restart: unless-stopped
    # Traefik reaches the service on the Compose network; do not publish a host
    # port in production and accidentally bypass the edge proxy.
    expose:
      - "10000"
    environment:
      NODE_ENV: production
      PORT: 10000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-${NEXT_PUBLIC_APP_URL}}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Prefer a per-service sb_secret key; keep the legacy key only during
      # migration. Application code resolves both inside one server-only module.
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      CRON_SECRET: ${CRON_SECRET}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS}
      # Sentry runtime envs (server-side, NOT NEXT_PUBLIC_). DSN unset = SDK no-op.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.1}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:10000/api/livez"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        # Tag is consumed by Grafana Alloy (PR #10) as `service`/`app` labels in Loki.
        tag: "{{.ImageName}}/{{.Name}}/{{.ID}}"

  # Grafana Alloy log shipper. Profiled so the service only starts when
  # Coolify (or local dev) sets COMPOSE_PROFILES=observability — keeps
  # this PR safe to merge before Grafana Cloud credentials are provisioned
  # in the env vault. Once GRAFANA_LOKI_* are set, flip the profile and
  # logs start flowing.
  alloy:
    image: grafana/alloy@sha256:4f6ddc56ffdcf8a6316748fc5162972e20cb301523cac1bb4a31957df733ae9b
    container_name: compass-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER}
      GRAFANA_LOKI_TOKEN: ${GRAFANA_LOKI_TOKEN}
      HOSTNAME: ${ALLOY_HOSTNAME:-compass-prod}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

secrets:
  SENTRY_AUTH_TOKEN:
    environment: SENTRY_AUTH_TOKEN
